<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BananaGIS — Field Survey</title><link rel="stylesheet" href="./style.css"></head>
<body><header><div><h1>🍌 BananaGIS</h1><p>Banana Smart Farm & Intelligence Platform</p></div><span class="badge">PHASE 1 MVP</span></header><main><section class="kpis"><div><b id="farmCount">0</b><span>จำนวนแปลง</span></div><div><b id="areaTotal">0</b><span>พื้นที่รวม (ไร่)</span></div><div><b id="provinceCount">0</b><span>จังหวัด</span></div></section><section class="toolbar"><label>จังหวัด <select id="provinceFilter"><option value="">ทั้งหมด</option></select></label><button id="fitBtn">แสดงทั้งหมด</button><button id="addBtn">＋ เพิ่มแปลงกล้วย</button></section><section class="workspace"><div id="map" aria-label="Banana farm map"></div><aside><h2>แปลงกล้วย</h2><div id="farmList"></div></aside></section></main><dialog id="farmDialog"><form method="dialog" id="farmForm"><h2>🍌 เพิ่มแปลงกล้วย</h2><label>รหัสแปลง<input id="farm_id" required placeholder="BF-0003"></label><label>ชื่อเกษตรกร<input id="grower_name" required></label><label>โทรศัพท์<input id="phone" inputmode="tel"></label><label>พันธุ์กล้วย<select id="variety"><option>กล้วยน้ำว้า</option><option>กล้วยหอมทอง</option><option>กล้วยไข่</option><option>กล้วยหักมุก</option><option>กล้วยเล็บมือนาง</option><option>กล้วยหอมเขียว</option><option>อื่น ๆ</option></select></label><label>วันที่ปลูก<input id="planting_date" type="date"></label><label>จำนวนต้น<input id="plant_count" type="number" min="0"></label><label>พื้นที่ (ไร่)<input id="area_rai" type="number" min="0" step="0.1" required></label><label>พิกัด<input id="coordinates" readonly placeholder="กดใช้ตำแหน่ง GPS หรือคลิกบนแผนที่"></label><div class="form-actions"><button value="cancel">ยกเลิก</button><button type="button" id="gpsBtn">📍 ใช้ GPS</button><button type="button" id="saveBtn">บันทึก</button></div><p id="formMsg"></p></form></dialog><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet"><script src="./app.js"></script></body></html>
